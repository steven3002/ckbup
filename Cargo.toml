[package]
name = "ckbup"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Steven Hert"]
description = "Installer and version manager for official CKB tool releases"
readme = "README.md"
license = "MIT"
repository = "https://github.com/steven3002/ckbup"
keywords = ["ckb", "nervos", "installer", "toolchain", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
ureq = "3.5.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
